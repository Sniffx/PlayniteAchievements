name: Build extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep line endings untouched
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Apply gameUnlockedCount / gameAchievementCount patch
        shell: bash
        run: |
          if [ -f token-patch.diff ]; then
            git apply --ignore-whitespace --verbose token-patch.diff
          else
            echo "No token-patch.diff found, building unpatched source"
          fi

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore source/PlayniteAchievements.sln

      - name: Build (Release)
        run: msbuild source/PlayniteAchievements.sln /p:Configuration=Release /m

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteAchievementsSantodan
          path: source/bin/Release/
